# Continuous integration (ADR-0012).
# Runs on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Service ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, library-service, acquisition-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # Compiles the service and runs its tests. Docker is available on the
      # runner, so Testcontainers tests can start a real PostgreSQL later.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type check and bundle)
        run: npm run build

      - name: Test
        run: npm test

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Range requests, blocked paths and the 503 answer, with real HTTP (gateway/tests/README.md).
      - name: Check the gateway
        run: gateway/tests/check-gateway.sh

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # compose.yaml requires passwords. These are throwaway placeholders that
      # only exist for this run, not real secrets.
      - name: Create a placeholder environment file
        run: |
          {
            echo "ACQUISITION_TO_LIBRARY_TOKEN=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=ci-placeholder"
            echo "IDENTITY_DB_PASSWORD=ci-placeholder"
            echo "LIBRARY_DB_PASSWORD=ci-placeholder"
            echo "ACQUISITION_DB_PASSWORD=ci-placeholder"
            echo "JWT_PRIVATE_KEY_PATH=./ci-placeholder.pem"
            echo "JWT_PUBLIC_KEY_PATH=./ci-placeholder.pem"
            echo "IDENTITY_TO_LIBRARY_TOKEN=ci-placeholder"
            echo "QBITTORRENT_USERNAME=ci-placeholder"
            echo "QBITTORRENT_PASSWORD=$(openssl rand -hex 16)"
          } > "$RUNNER_TEMP/ci.env"

      - name: Validate compose.yaml
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" config --quiet

      # R-12: business services and the database publish no port to the host, so they can only
      # be reached through the gateway. Only the gateway (and later the torrent peer port, R-21)
      # may publish one.
      - name: Check that only the gateway publishes ports
        run: |
          published=$(docker compose --env-file "$RUNNER_TEMP/ci.env" config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key' \
            | grep -v -x -E 'gateway|qbittorrent' || true)
          if [ -n "$published" ]; then
            echo "These services must not publish ports: $published"
            exit 1
          fi

      # Builds the gateway (with the React app) and the three service images,
      # which catches a broken Dockerfile before it reaches main.
      - name: Build the images
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" build

      # The torrent client is reachable only by the acquisition service and publishes only its peer port
      # (ADR-0014, ADR-0023, R-18, R-21). Starts the gateway and qBittorrent and checks it from every side.
      - name: Check the torrent client isolation
        run: |
          docker compose --env-file "$RUNNER_TEMP/ci.env" up -d --wait gateway qbittorrent
          qbittorrent/check-isolation.sh "$RUNNER_TEMP/ci.env"

      - name: Show the torrent client log on failure
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" logs qbittorrent

      - name: Stop the containers
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/ci.env" down -v
