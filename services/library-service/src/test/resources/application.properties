# The service refuses to start without the identity service's public key (G5).
# Tests use this PUBLIC key only: its private key was discarded, so no valid token can be made
# with it. Tests that need valid tokens generate their own key pair (security/TestTokens).
homeflix.security.public-key-file=classpath:test-jwt-public.pem

# Calls from the acquisition service on /internal (ADR-0022). The service refuses to start without it.
homeflix.internal.acquisition-token=test-acquisition-token-not-a-secret

# The identity service calls the library to delete the data of a deleted profile (K3).
homeflix.internal.identity-token=test-identity-token-not-a-secret
