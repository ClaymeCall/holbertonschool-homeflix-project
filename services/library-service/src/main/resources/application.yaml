spring:
  application:
    name: library-service

server:
  port: 8082

# Only the health endpoint is exposed, for Docker health checks.
# Details are hidden so nothing technical leaks to callers.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Where the identity service is reached on the Compose network (ADR-0008).
homeflix:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}

  # Calls to other services: timeouts and retry policy (ADR-0020, R-24).
  # Only GET is retried, once, after a connection failure, a timeout or a 502, 503 or 504.
  http-client:
    connect-timeout: 2s
    read-timeout: 5s
    retries: 1
    retry-pause: 200ms
  # Secret the acquisition service sends in X-Service-Token to the /internal endpoints (ADR-0022).
  # The service refuses to start without it.
  internal:
    acquisition-token: ${ACQUISITION_TO_LIBRARY_TOKEN:}
    # The secret the identity service sends, to delete the data of a deleted profile. The service refuses to
    # start without it.
    identity-token: ${IDENTITY_TO_LIBRARY_TOKEN:}
  library:
    # Where completed downloads land. It must be an authorized root for a download to be handed over.
    downloads-path: /media/downloads
    # The folders Docker mounts into the container. An authorized root must be inside one of them (R-02).
    mounted-paths: /media/library,/media/downloads
    # Hosts a poster image can come from (ADR-0018). Exact host names, comma separated, https only.
    poster-hosts: ${POSTER_ALLOWED_HOSTS:upload.wikimedia.org}
