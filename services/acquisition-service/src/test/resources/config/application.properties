# Test values for the settings the service refuses to start without (ADR-0022, ADR-0023). Nothing listens
# on port 9: tests that call the library or the torrent client point these at their own stub or container.
homeflix.library.base-url=http://127.0.0.1:9
homeflix.library.service-token=test-token-0123456789abcdef0123456789abcdef
homeflix.qbittorrent.url=http://127.0.0.1:9
homeflix.qbittorrent.username=homeflix-test
homeflix.qbittorrent.password=test-password-123
# Short timeouts so a test against a stopped dependency stays fast.
homeflix.http-client.connect-timeout=500ms
homeflix.http-client.read-timeout=2s
homeflix.http-client.retry-pause=50ms
# The status check runs only when a test calls it (DownloadTracker.check).
homeflix.downloads.tracking.enabled=false
