spring:
  application:
    name: identity-service
  datasource:
    hikari:
      data-source-properties:
        # PostgreSQL adds the failing row to some errors ("Failing row contains ..."),
        # which would put an email and a password hash into exceptions and logs.
        # This keeps only the error itself, with the constraint name (SEC-04, R-08).
        "[logServerErrorDetail]": "false"

server:
  port: 8081

# Only the health endpoint is exposed, for Docker health checks.
# Details are hidden so nothing technical leaks to callers.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Session token (ADR-0009, docs/architecture/identity-and-permissions.md).
homeflix:
  session:
    # Path of the RSA private key file (PKCS#8 PEM), a mounted secret in Docker
    # (identity and permissions design, "Keys and secrets"). The service refuses to start without it.
    private-key-file: ${IDENTITY_JWT_PRIVATE_KEY_FILE:}
    token-lifetime: 15m
    # Set to true once HomeFlix is served over HTTPS (issue L8).
    cookie-secure: false
  # The library service, called to delete a profile's data (consistency rules, ADR-0022).
  library:
    base-url: ${LIBRARY_SERVICE_URL:http://library-service:8082}
    # Secret sent in X-Service-Token. The service refuses to start without it.
    service-token: ${IDENTITY_TO_LIBRARY_TOKEN:}
  # Service-to-service calls (ADR-0020).
  http-client:
    connect-timeout: 2s
    read-timeout: 5s
