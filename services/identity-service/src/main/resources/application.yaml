spring:
  application:
    name: identity-service

server:
  port: 8081

# Only the health endpoint is exposed, for Docker health checks.
# Details are hidden so nothing technical leaks to callers.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Session token (ADR-0009, docs/architecture/identity-and-permissions.md).
homeflix:
  session:
    # Path of the RSA private key file (PKCS#8 PEM), a mounted secret in Docker
    # (identity and permissions design, "Keys and secrets"). The service refuses to start without it.
    private-key-file: ${IDENTITY_JWT_PRIVATE_KEY_FILE:}
    token-lifetime: 15m
    # Set to true once HomeFlix is served over HTTPS (issue L8).
    cookie-secure: false
