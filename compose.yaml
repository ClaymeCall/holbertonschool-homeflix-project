# HomeFlix: start everything with `docker compose up --build`.
# Copy .env.example to .env and fill in the passwords first.

name: homeflix

services:
  # ---- Gateway: the only component published to the host (ADR-0013) ----
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Business services (ADR-0003). No ports are published. ----
  identity-service:
    build: ./services/identity-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homeflix_identity
      SPRING_DATASOURCE_USERNAME: homeflix_identity
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      # Signs the session token (ADR-0009). Only the identity service gets the private key,
      # as a mounted secret (identity and permissions design, "Keys and secrets").
      IDENTITY_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      # Secret sent to the library when a profile is deleted (ADR-0022, consistency rules).
      IDENTITY_TO_LIBRARY_TOKEN: ${IDENTITY_TO_LIBRARY_TOKEN:?Set IDENTITY_TO_LIBRARY_TOKEN in .env}
    secrets:
      - jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  library-service:
    build: ./services/library-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homeflix_library
      SPRING_DATASOURCE_USERNAME: homeflix_library
      SPRING_DATASOURCE_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD in .env}
      # Verifies the session token with the identity service's PUBLIC key only (G5).
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    secrets:
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    volumes:
      # Source library: read-only, the application never writes to it.
      - ${MEDIA_LIBRARY_PATH:-./data/library}:/media/library:ro
      # Completed downloads: read-only, so they can be indexed and played.
      - ${DOWNLOADS_PATH:-./data/downloads}:/media/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  acquisition-service:
    build: ./services/acquisition-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/homeflix_acquisition
      SPRING_DATASOURCE_USERNAME: homeflix_acquisition
      SPRING_DATASOURCE_PASSWORD: ${ACQUISITION_DB_PASSWORD:?Set ACQUISITION_DB_PASSWORD in .env}
      # Login to the torrent client's API, the same values qBittorrent is configured with (J5 uses them).
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:?Set QBITTORRENT_USERNAME in .env}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in .env}
      # Verifies the session token with the identity service's PUBLIC key only (G5).
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    secrets:
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, p2p]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---- Database (ADR-0006): one server, one database and user per service ----
  postgres:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeflix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD:?Set LIBRARY_DB_PASSWORD in .env}
      ACQUISITION_DB_PASSWORD: ${ACQUISITION_DB_PASSWORD:?Set ACQUISITION_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- Peer-to-peer client (ADR-0014, ADR-0023) ----
  # The web interface and its API (port 8080) are NOT published: only the acquisition service reaches
  # them, over the private p2p network. Only the BitTorrent peer port is published, so other peers can
  # connect (R-21). The image adds a start script that applies the login from .env and the seeding
  # limit at every start (qbittorrent/, docs/acquisition/torrent-client.md).
  qbittorrent:
    build: ./qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      WEBUI_PORT: 8080
      # Same number inside and outside, so the port announced to peers is the one they can reach.
      TORRENTING_PORT: ${QBITTORRENT_PEER_PORT:-6881}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:?Set QBITTORRENT_USERNAME in .env}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in .env}
      QBITTORRENT_MAX_RATIO: ${QBITTORRENT_MAX_RATIO:-1.0}
      QBITTORRENT_MAX_SEEDING_MINUTES: ${QBITTORRENT_MAX_SEEDING_MINUTES:-60}
    ports:
      - "${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}/tcp"
      - "${QBITTORRENT_PEER_PORT:-6881}:${QBITTORRENT_PEER_PORT:-6881}/udp"
    volumes:
      - qbittorrent-config:/config
      # Completed downloads land here: the only container that writes there (ACQ-06, R-20).
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
      # Downloads in progress. No other container mounts it, so a partial file is never indexed.
      - qbittorrent-incomplete:/incomplete
    networks: [p2p]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # Gateway, services and database.
  backend: {}
  # Acquisition service and qBittorrent only. Not marked internal because the
  # client needs outbound access to reach peers.
  p2p: {}

volumes:
  postgres-data: {}
  qbittorrent-config: {}
  qbittorrent-incomplete: {}

secrets:
  # RSA private key that signs session tokens. Generated by the operator, never committed
  # (see .env.example). Mounted read-only at /run/secrets/jwt_private_key.
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_PATH:?Set JWT_PRIVATE_KEY_PATH in .env}
  # Matching public key, mounted read-only into the library and acquisition services, which
  # verify tokens but cannot sign them (identity and permissions design, "Keys and secrets").
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:?Set JWT_PUBLIC_KEY_PATH in .env}
