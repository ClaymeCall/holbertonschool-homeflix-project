# HomeFlix gateway (ADR-0013, ADR-0017).
#
# - Serves the React app.
# - Routes /api/<service>/... to the matching service and strips the prefix,
#   so /api/library/media/1 reaches library-service as /media/1.
# - Never routes to qBittorrent or the database: they are not reachable from here.
# - Only routes. Each service still verifies identity and permissions itself.

# Docker's internal DNS. Upstream names are resolved at request time (through
# variables), so the gateway starts and serves the app even if a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # img-src from POSTER_ALLOWED_HOSTS, written at start by docker-entrypoint.d/40-poster-csp.sh (issue #59).
    # Nginx drops these server-level headers in any location that sets its own add_header, so a location here
    # must not set one (check-gateway.sh checks the header on every kind of answer).
    include /etc/nginx/conf.d/csp.inc;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API routing -------------------------------------------------------

    # Operational endpoints of the services are never exposed through the gateway.
    location ~* ^/api/[^/]+/actuator(/|$) {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This address does not exist."}';
    }

    # Calls between services use /internal paths and are never reachable from a browser (ADR-0022).
    # nginx matches on the normalised path, so //, /./ and %2e forms land here too.
    location ~* ^/api/[^/]+/internal(/|$) {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This address does not exist."}';
    }

    location /api/identity/ {
        set $upstream http://identity-service:8081;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
        error_page 502 503 504 = @service_unavailable;
    }

    location /api/library/ {
        set $upstream http://library-service:8082;
        rewrite ^/api/library/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
        # Video streaming: pass bytes straight through so HTTP Range requests
        # (seeking) work without the gateway buffering whole files.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        error_page 502 503 504 = @service_unavailable;
    }

    location /api/acquisition/ {
        set $upstream http://acquisition-service:8083;
        rewrite ^/api/acquisition/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
        error_page 502 503 504 = @service_unavailable;
    }

    # Any other /api path: no such service. Same answer without the trailing slash.
    location = /api {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This address does not exist."}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"not_found","message":"This address does not exist."}';
    }

    # A service is down or too slow. Plain wording, no technical details.
    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"This part of HomeFlix is temporarily unavailable. Please try again in a moment."}';
    }

    # ---- Frontend (single-page app) ---------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
